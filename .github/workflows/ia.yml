name: ia
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://x.ai/cli/install.sh | bash
      - run: |
          grok -p "Lee el PR y explica de forma sencilla que hace el PR. Si hay algún error, el comentario generado debe poner: “La IA ha fallado”." --always-approve
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
